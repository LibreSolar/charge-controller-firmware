description: |
  Half bridge using an STM32 advanced-control timer (e.g. TIM1)

  The node must be a child of an st,stm32-timers node. The high-side switch is driven by output
  CHx and the low-side switch by the complementary output CHxN. The timer runs in edge-aligned
  mode and the dead time is generated in hardware.

  Example:

    &timers1 {
        status = "okay";

        halfbridge: half-bridge {
            compatible = "libresolar,stm32-advtim-half-bridge";
            pinctrl-0 = <&tim1_ch1_pa8 &tim1_ch1n_pc13>;
            pinctrl-names = "default";
            channel = <1>;
            frequency = <70000>;
            deadtime-ns = <300>;
        };
    };

compatible: "libresolar,stm32-advtim-half-bridge"

include: [base.yaml, pinctrl-device.yaml, half-bridge-common.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  channel:
    type: int
    required: true
    enum: [1, 2, 3, 4]
    description: |
      Timer channel driving the high-side switch with output CHx and the low-side switch with
      complementary output CHxN

  adc-trigger:
    type: boolean
    description: |
      Trigger ADC conversions in the middle of the on-time using OC6 via TRGO2

      Only supported by timers providing channel 6 and TRGO2 (e.g. TIM1 of STM32G4).
