description: |
  Half bridge using an STM32 timer (TIM)

  The node must be a child of an st,stm32-timers node. Two operating modes are supported:

  - Complementary outputs (default): The high-side switch is driven by output CHx and the
    low-side switch by the complementary output CHxN of an advanced-control timer like TIM1.
    The timer runs in edge-aligned mode and the dead time is generated in hardware.

  - Two independent channels (if low-side-channel is specified): The high-side and low-side
    switches are driven by two channels of a general-purpose timer like TIM3. The timer runs
    in center-aligned mode and the dead time is generated by shifting the compare value of the
    low-side channel, which has inverted polarity.

  Example for complementary outputs:

    &timers1 {
        status = "okay";

        halfbridge: half-bridge {
            compatible = "libresolar,stm32-half-bridge";
            pinctrl-0 = <&tim1_ch1_pa8 &tim1_ch1n_pc13>;
            pinctrl-names = "default";
            channel = <1>;
            frequency = <70000>;
            deadtime-ns = <300>;
        };
    };

compatible: "libresolar,stm32-half-bridge"

include: [base.yaml, pinctrl-device.yaml, half-bridge-common.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  channel:
    type: int
    required: true
    enum: [1, 2, 3, 4]
    description: Timer channel driving the high-side switch

  low-side-channel:
    type: int
    enum: [1, 2, 3, 4]
    description: |
      Timer channel driving the low-side switch

      If not specified, the complementary output of the high-side channel is used.

  adc-trigger:
    type: boolean
    description: |
      Trigger ADC conversions in the middle of the on-time using OC6 via TRGO2

      Only supported with complementary outputs and timers providing channel 6 and TRGO2
      (e.g. TIM1 of STM32G4).
